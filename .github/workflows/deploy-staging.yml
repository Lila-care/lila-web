name: Deploy Staging (label)

concurrency:
  group: deploy-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [labeled]
    branches: ["**"]

permissions:
  contents: write

jobs:
  deploy-staging:
    if: github.event.label.name == 'staging'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Amplify (not Vercel) hosts this app, and it only auto-builds on a push to the
      # "staging" branch itself — there's no per-PR preview environment. "staging" is a
      # single shared slot: whichever PR gets labeled becomes what's live on
      # staging.lilacareapp.com, so this force-pushes over whatever was there before.
      - name: Push PR branch to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:refs/heads/staging --force

      - name: Trigger and wait for Amplify build
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AMPLIFY_APP_ID: d12kklaxfcdyvo
        run: |
          # Amplify's webhook-triggered auto-build doesn't reliably create a job for pushes
          # to "staging" (confirmed: GitHub delivers the webhook, Amplify 202s it, no job
          # ever appears) — also, its jobs report commitId as the literal string "HEAD",
          # never a real SHA, so there'd be no reliable way to match "our" job anyway.
          # Starting the job ourselves sidesteps both problems: we get the exact jobId back.
          JOB_ID=$(aws amplify start-job --app-id "$AMPLIFY_APP_ID" --branch-name staging --job-type RELEASE --query 'jobSummary.jobId' --output text)
          echo "Started Amplify job $JOB_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name staging --job-id "$JOB_ID" --query 'job.summary.status' --output text)
            echo "Job $JOB_ID status=$STATUS, intento $attempt/30"

            if [ "$STATUS" = "SUCCEED" ]; then
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Amplify build terminó en estado $STATUS" >&2
              exit 1
            fi

            sleep 20
          done

          echo "Timeout esperando el build de Amplify en staging" >&2
          exit 1

      - name: Notify Product QA gate (#themis-verdict)
        if: success()
        run: |
          curl -sf -X POST "${{ secrets.SLACK_BOT_WEBHOOK_URL }}/webhooks/deploy-success" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "pr_number": ${{ github.event.pull_request.number }},
              "pr_title": ${{ toJSON(github.event.pull_request.title) }},
              "pr_url": "${{ github.event.pull_request.html_url }}",
              "sha": "${{ github.event.pull_request.head.sha }}"
            }'
