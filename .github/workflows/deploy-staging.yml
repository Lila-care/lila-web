name: Deploy Staging (label)

concurrency:
  group: deploy-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [labeled]
    branches: ["**"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    # .npmrc resolves @lila-care/design-system from GitHub Packages via
    # ${NODE_AUTH_TOKEN}; yarn needs it set for every yarn invocation in this
    # job, not just install, because it reads .npmrc up front regardless of
    # whether that step touches the network. GITHUB_TOKEN can't be used here —
    # it doesn't carry package-read access across repos in the org — so this
    # needs a PAT with read:packages stored as the GH_PACKAGES_READ_TOKEN
    # secret (see Lila-care/lila-web#29 for context).
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
        env:
          VITE_AUTH_DOMAIN: https://lila-app-dev.auth.us-east-1.amazoncognito.com
          VITE_CLIENT_ID: e2e-test-client-id
          VITE_REDIRECT_URI: http://localhost:5173/auth/callback
          VITE_API_URL: http://localhost:6100

  deploy-staging:
    if: github.event.label.name == 'staging'
    needs: test
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Amplify (not Vercel) hosts this app, and it only auto-builds on a push to the
      # "staging" branch itself — there's no per-PR preview environment. "staging" is a
      # single shared slot: whichever PR gets labeled becomes what's live on
      # staging.lilacareapp.com, so this force-pushes over whatever was there before.
      - name: Push PR branch to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:refs/heads/staging --force

      - name: Trigger and wait for Amplify build
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AMPLIFY_APP_ID: d12kklaxfcdyvo
        run: |
          # Amplify's webhook-triggered auto-build isn't reliable enough to depend on alone,
          # so we still start the job ourselves to get an exact jobId back. But the webhook
          # sometimes *does* win the race (it fires on our push before this step runs), and
          # when it does, start-job fails with LimitExceededException even though a build for
          # this exact commit is already under way. Rather than treat that as a failure,
          # attach to whatever job Amplify already started.
          JOB_ID=$(aws amplify start-job --app-id "$AMPLIFY_APP_ID" --branch-name staging --job-type RELEASE --query 'jobSummary.jobId' --output text 2>/tmp/start-job-err) || {
            if grep -q "already have pending or running jobs" /tmp/start-job-err; then
              echo "Amplify's webhook already started a build for this push — attaching to it"
              JOB_ID=$(aws amplify list-jobs --app-id "$AMPLIFY_APP_ID" --branch-name staging --max-results 1 --query 'jobSummaries[0].jobId' --output text)
            else
              cat /tmp/start-job-err >&2
              exit 1
            fi
          }
          echo "Watching Amplify job $JOB_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name staging --job-id "$JOB_ID" --query 'job.summary.status' --output text)
            echo "Job $JOB_ID status=$STATUS, intento $attempt/30"

            if [ "$STATUS" = "SUCCEED" ]; then
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Amplify build terminó en estado $STATUS" >&2
              exit 1
            fi

            sleep 20
          done

          echo "Timeout esperando el build de Amplify en staging" >&2
          exit 1

      - name: Notify Product QA gate (#themis-verdict)
        if: success()
        env:
          SLACK_BOT_WEBHOOK_URL: ${{ secrets.SLACK_BOT_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # PR title is author-controlled text — pass it through env + jq (never inline
          # GitHub Actions expressions into the JSON body) so quotes/apostrophes in the
          # title can't break the payload or, worse, get interpreted as shell syntax.
          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_url "$PR_URL" \
            --arg sha "$SHA" \
            '{repo: $repo, pr_number: $pr_number, pr_title: $pr_title, pr_url: $pr_url, sha: $sha}')

          curl -sf -X POST "$SLACK_BOT_WEBHOOK_URL/webhooks/deploy-success" \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
